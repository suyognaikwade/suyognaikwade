<svg width="100%" height="320" viewBox="0 0 850 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sysArchBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <pattern id="archGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#1e293b"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .badge-scale {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #94a3b8;
    }
    .tier-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .tier-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      fill: #ffffff;
    }
    .tier-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .tech-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Base Container -->
  <rect width="850" height="320" rx="10" fill="url(#sysArchBg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="850" height="320" rx="10" fill="url(#archGrid)"/>
  <rect x="0" y="0" width="850" height="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Schematic Header -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" class="title">Enterprise System Architecture</text>
    <text x="0" y="16" class="badge-scale">Engineered for Multi-Million $ Monthly GMV • 99.99% Availability • Global Concurrency</text>
  </g>

  <!-- LAYER 1: CLIENT & COMMERCE STOREFRONTS -->
  <g transform="translate(32, 58)">
    <rect width="786" height="52" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#34d399"/>
    <text x="18" y="20" class="tier-header" fill="#34d399">Layer 1: High-Conversion Storefronts &amp; Client Interfaces</text>
    <text x="18" y="38" class="tier-desc">Shopify Plus (Custom Apps &amp; Checkout) • Magento / Adobe Commerce • WooCommerce &amp; WP • OpenCart • React 19 &amp; Next.js 15</text>
  </g>

  <!-- Connector Line 1 -->
  <line x1="425" y1="110" x2="425" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LAYER 2: EDGE INGRESS & ZERO-TRUST SECURITY -->
  <g transform="translate(32, 120)">
    <rect width="786" height="52" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#38bdf8"/>
    <text x="18" y="20" class="tier-header" fill="#38bdf8">Layer 2: Edge Delivery, Ingress &amp; Zero-Trust Protection</text>
    <text x="18" y="38" class="tier-desc">Cloudflare Enterprise CDN &amp; WAF • Multi-Cloud Ingress (AWS ALB / GCP Cloud Armor) • Strict Rate Limiting • OAuth2 / JWT</text>
  </g>

  <!-- Connector Line 2 -->
  <line x1="425" y1="172" x2="425" y2="182" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LAYER 3: MULTI-TENANT SAAS & APPLIED AI SERVICES -->
  <g transform="translate(32, 182)">
    <rect width="786" height="52" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="52" rx="2" fill="#818cf8"/>
    <text x="18" y="20" class="tier-header" fill="#818cf8">Layer 3: Multi-Tenant SaaS Runtimes &amp; Applied AI Core</text>
    <text x="18" y="38" class="tier-desc">TypeScript &amp; Node.js Services • Prisma ORM • Asynchronous Event Queues • Autonomous Agents (Gemini / Claude) • Vector Search (RAG)</text>
  </g>

  <!-- Connector Line 3 -->
  <line x1="425" y1="234" x2="425" y2="244" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LAYER 4: MULTI-CLOUD INFRASTRUCTURE & DATA MESH -->
  <g transform="translate(32, 244)">
    <rect width="786" height="54" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="54" rx="2" fill="#f59e0b"/>
    <text x="18" y="20" class="tier-header" fill="#f59e0b">Layer 4: Multi-Cloud Infrastructure, Persistence &amp; CI/CD</text>
    <text x="18" y="38" class="tier-desc">AWS • Google Cloud Platform • Microsoft Azure • Oracle Cloud (OCI) • PostgreSQL Clusters • Redis • Kubernetes • Automated CI/CD</text>
  </g>
</svg>

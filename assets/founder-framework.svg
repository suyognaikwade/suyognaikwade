<svg width="100%" height="140" viewBox="0 0 850 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="33%" stop-color="#38bdf8"/>
      <stop offset="66%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16223a"/>
      <stop offset="100%" stop-color="#0c1424"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseStep {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .flow-step {
      animation: pulseStep 3s ease-in-out infinite;
    }
    .header-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .step-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .step-head {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.2px;
    }
    .step-desc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Container Base -->
  <rect width="850" height="140" rx="12" fill="url(#frameBg)" stroke="#1e293b" stroke-width="1.8"/>
  <rect x="0" y="0" width="850" height="3" fill="url(#topLineGrad)"/>

  <!-- Title -->
  <text x="24" y="24" class="header-tag">// THE FOUNDER EXECUTION FRAMEWORK: IDEA TO MULTI-MILLION SCALE</text>

  <!-- 4 Step Pipeline -->
  <!-- Step 1 -->
  <g transform="translate(20, 36)" class="flow-step">
    <rect width="190" height="88" rx="8" fill="url(#stepBg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="18" r="4" fill="#f59e0b"/>
    <text x="26" y="22" class="step-num" fill="#f59e0b">01. DISCOVERY &amp; SCOPE</text>
    <text x="16" y="46" class="step-head">Commercial Modeling</text>
    <text x="16" y="64" class="step-desc">High-Volume Architecture</text>
    <text x="16" y="78" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Revenue &amp; Load Projections</text>
  </g>

  <!-- Connector 1 -->
  <path d="M 213 80 L 222 80" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Step 2 -->
  <g transform="translate(225, 36)" class="flow-step">
    <rect width="190" height="88" rx="8" fill="url(#stepBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
    <text x="26" y="22" class="step-num" fill="#38bdf8">02. CORE ARCHITECTURE</text>
    <text x="16" y="46" class="step-head">Full-Stack &amp; Commerce</text>
    <text x="16" y="64" class="step-desc">Shopify / Magento / SaaS</text>
    <text x="16" y="78" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">React 19 • Node • Postgres</text>
  </g>

  <!-- Connector 2 -->
  <path d="M 418 80 L 427 80" stroke="#818cf8" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Step 3 -->
  <g transform="translate(430, 36)" class="flow-step">
    <rect width="192" height="88" rx="8" fill="url(#stepBg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="18" r="4" fill="#818cf8"/>
    <text x="26" y="22" class="step-num" fill="#c084fc">03. MULTI-CLOUD SCALE</text>
    <text x="16" y="46" class="step-head">Zero-Downtime Infra</text>
    <text x="16" y="64" class="step-desc">AWS • GCP • Azure • OCI</text>
    <text x="16" y="78" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Kubernetes &amp; SonarQube CI</text>
  </g>

  <!-- Connector 3 -->
  <path d="M 625 80 L 634 80" stroke="#10b981" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Step 4 -->
  <g transform="translate(637, 36)" class="flow-step">
    <rect width="192" height="88" rx="8" fill="url(#stepBg)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="18" r="4" fill="#10b981"/>
    <text x="26" y="22" class="step-num" fill="#34d399">04. AI &amp; EXPANSION</text>
    <text x="16" y="46" class="step-head">Autonomous Scaling</text>
    <text x="16" y="64" class="step-desc">Agentic Workflows &amp; LLMs</text>
    <text x="16" y="78" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Multi-Million $ Monthly GMV</text>
  </g>
</svg>

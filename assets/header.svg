<svg width="100%" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .terminal-tag {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #38bdf8;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .pulse-line {
      animation: pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="850" height="200" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Tech Grid Overlay -->
  <rect width="850" height="200" rx="12" fill="url(#grid)"/>

  <!-- Top Accent Terminal Bar -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="44" cy="24" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="60" cy="24" r="5" fill="#10b981" opacity="0.85"/>

  <!-- Terminal Label -->
  <text x="80" y="28" class="terminal-tag">// SYSTEM ARCHITECT &amp; MULTI-CLOUD / DEVOPS ENGINEER</text>

  <!-- Main Title -->
  <text x="50%" y="95" text-anchor="middle" class="title">Suyog Naikwade</text>

  <!-- Subtitle -->
  <text x="50%" y="130" text-anchor="middle" class="subtitle">Enterprise SaaS Architecture • Multi-Cloud (AWS | GCP | Azure | OCI) • DevOps Automation • Applied AI</text>

  <!-- Pills / Badges in Header -->
  <g transform="translate(195, 150)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8"/>
    <text x="26" y="17" class="badge-text">Distributed Systems</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="156" cy="13" r="3.5" fill="#818cf8"/>
    <text x="168" y="17" class="badge-text">Multi-Cloud</text>

    <!-- Pill 3 -->
    <rect x="259" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="273" cy="13" r="3.5" fill="#a855f7"/>
    <text x="285" y="17" class="badge-text">DevOps CI/CD</text>

    <!-- Pill 4 -->
    <rect x="366" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="380" cy="13" r="3.5" fill="#34d399"/>
    <text x="392" y="17" class="badge-text">Applied AI</text>
  </g>

  <!-- Glowing Bottom Accent Line -->
  <rect x="50" y="196" width="750" height="2.5" rx="1" fill="url(#lineGrad)" class="pulse-line"/>
</svg>

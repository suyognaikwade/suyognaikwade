<svg width="100%" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="execBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Accent Border -->
    <linearGradient id="goldCyanBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="metricCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17223b"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="execGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    .kicker {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #38bdf8;
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #f1f5f9;
      letter-spacing: 0.3px;
    }
    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .card-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
      letter-spacing: 0.2px;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .glow-line {
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect width="850" height="240" rx="14" fill="url(#execBg)" stroke="#22314e" stroke-width="1.8"/>
  <rect width="850" height="240" rx="14" fill="url(#execGrid)"/>

  <!-- Top Accent Window Dots -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.9"/>
  <circle cx="44" cy="24" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="60" cy="24" r="5" fill="#10b981" opacity="0.9"/>

  <!-- Kicker Headline -->
  <text x="82" y="29" class="kicker">FOUNDER • SERIAL SAAS BUILDER • GLOBAL E-COMMERCE ARCHITECT</text>

  <!-- Main Name -->
  <text x="50%" y="82" text-anchor="middle" class="name-title">Suyog Naikwade</text>

  <!-- Subtitle Tagline -->
  <text x="50%" y="112" text-anchor="middle" class="tagline">Engineering Multi-Million Dollar Monthly Scale • Enterprise SaaS • High-Volume Retail Platforms</text>

  <!-- 4 Executive Impact Metric Cards -->
  <!-- Card 1: Multi-Million Scale -->
  <g transform="translate(24, 136)">
    <rect width="188" height="74" rx="8" fill="url(#metricCardBg)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="22" r="4" fill="#f59e0b"/>
    <text x="26" y="26" class="card-num" fill="#f59e0b">$1M+ / MONTH</text>
    <text x="16" y="47" class="card-label">Client Revenue Scale</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">High-Volume GMV</text>
  </g>

  <!-- Card 2: SaaS & Retail Products -->
  <g transform="translate(224, 136)">
    <rect width="188" height="74" rx="8" fill="url(#metricCardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="22" r="4" fill="#38bdf8"/>
    <text x="26" y="26" class="card-num" fill="#38bdf8">50+ PLATFORMS</text>
    <text x="16" y="47" class="card-label">Built &amp; Scaled</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">Enterprise SaaS &amp; Apps</text>
  </g>

  <!-- Card 3: E-Commerce Dominance -->
  <g transform="translate(424, 136)">
    <rect width="194" height="74" rx="8" fill="url(#metricCardBg)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="22" r="4" fill="#a855f7"/>
    <text x="26" y="26" class="card-num" fill="#c084fc">E-COMMERCE DOMAIN</text>
    <text x="16" y="47" class="card-label">Shopify • Magento • WP</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">OpenCart • Headless</text>
  </g>

  <!-- Card 4: Multi-Cloud & AI Infrastructure -->
  <g transform="translate(630, 136)">
    <rect width="194" height="74" rx="8" fill="url(#metricCardBg)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="16" cy="22" r="4" fill="#10b981"/>
    <text x="26" y="26" class="card-num" fill="#34d399">MULTI-CLOUD &amp; AI</text>
    <text x="16" y="47" class="card-label">AWS • GCP • Azure • OCI</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">Agentic AI &amp; Automation</text>
  </g>

  <!-- Bottom Glowing Edge -->
  <rect x="30" y="235" width="790" height="3" rx="1.5" fill="url(#goldCyanBorder)" class="glow-line"/>
</svg>

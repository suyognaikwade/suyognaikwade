<svg width="100%" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1e293b"/>
    </pattern>
  </defs>

  <style>
    .kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.6px;
      fill: #ffffff;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.1px;
    }
    .metric-val {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13.5px;
      font-weight: 800;
      fill: #f8fafc;
    }
    .metric-lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #64748b;
    }
  </style>

  <!-- Frame Base -->
  <rect width="850" height="200" rx="10" fill="url(#headerBase)" stroke="#1e293b" stroke-width="1.2"/>
  <rect width="850" height="200" rx="10" fill="url(#dotGrid)"/>

  <!-- Top Subtle Hairline -->
  <rect x="0" y="0" width="850" height="2" fill="#3b82f6" opacity="0.6"/>

  <!-- Left-Aligned Header Typography -->
  <g transform="translate(36, 32)">
    <text x="0" y="0" class="kicker">FOUNDER • SYSTEMS ARCHITECT • MULTI-CLOUD &amp; AI</text>
    <text x="0" y="36" class="name-title">Suyog Naikwade</text>
    <text x="0" y="64" class="tagline">Engineering high-throughput SaaS platforms and digital commerce ecosystems with multi-million dollar monthly scale.</text>
  </g>

  <!-- 4 Minimalist Metric Capsules -->
  <g transform="translate(36, 122)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="182" height="56" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="metric-val" fill="#38bdf8">$1M+ / Month</text>
    <text x="14" y="42" class="metric-lbl">Client Revenue Scale</text>

    <!-- Metric 2 -->
    <rect x="198" y="0" width="182" height="56" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="metric-val" fill="#34d399">50+ Platforms</text>
    <text x="14" y="42" class="metric-lbl">Built &amp; Scaled</text>

    <!-- Metric 3 -->
    <rect x="396" y="0" width="182" height="56" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="metric-val" fill="#818cf8">Commerce Authority</text>
    <text x="14" y="42" class="metric-lbl">Shopify • Magento • WP</text>

    <!-- Metric 4 -->
    <rect x="594" y="0" width="184" height="56" rx="6" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="24" class="metric-val" fill="#f59e0b">Multi-Cloud &amp; AI</text>
    <text x="14" y="42" class="metric-lbl">AWS • GCP • Azure • OCI</text>
  </g>
</svg>

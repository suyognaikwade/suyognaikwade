<svg width="100%" height="110" viewBox="0 0 850 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pulseBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="33%" stop-color="#818cf8"/>
      <stop offset="66%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes scanline {
      0% { transform: translateX(-850px); }
      100% { transform: translateX(850px); }
    }
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .hud-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .hud-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .blink-dot-1 { animation: blink 2.5s infinite; fill: #38bdf8; }
    .blink-dot-2 { animation: blink 2.5s infinite 0.6s; fill: #818cf8; }
    .blink-dot-3 { animation: blink 2.5s infinite 1.2s; fill: #c084fc; }
    .blink-dot-4 { animation: blink 2.5s infinite 1.8s; fill: #34d399; }
    .scan-beam {
      animation: scanline 5s linear infinite;
    }
  </style>

  <!-- Base Container -->
  <rect width="850" height="110" rx="10" fill="url(#hudGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Accent Glowing Border -->
  <rect x="0" y="0" width="850" height="2" fill="url(#pulseBorder)"/>

  <!-- Scanning beam effect -->
  <g opacity="0.15">
    <rect x="0" y="2" width="120" height="106" fill="url(#pulseBorder)" class="scan-beam"/>
  </g>

  <!-- 4 Architecture Quadrants -->
  <!-- Col 1: Multi-Cloud -->
  <g transform="translate(20, 20)">
    <rect width="190" height="70" rx="8" fill="#131b2e" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="16" cy="22" r="4" class="blink-dot-1"/>
    <text x="28" y="25" class="hud-title" fill="#38bdf8">MULTI-CLOUD</text>
    <text x="16" y="47" class="hud-val">AWS • GCP • Azure</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Oracle Cloud (OCI)</text>
  </g>

  <!-- Col 2: DevOps & IaC -->
  <g transform="translate(225, 20)">
    <rect width="190" height="70" rx="8" fill="#131b2e" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="16" cy="22" r="4" class="blink-dot-2"/>
    <text x="28" y="25" class="hud-title" fill="#818cf8">DEVOPS &amp; IAC</text>
    <text x="16" y="47" class="hud-val">Kubernetes • Docker</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Terraform • Jenkins • CI/CD</text>
  </g>

  <!-- Col 3: Applied AI -->
  <g transform="translate(430, 20)">
    <rect width="190" height="70" rx="8" fill="#131b2e" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="16" cy="22" r="4" class="blink-dot-3"/>
    <text x="28" y="25" class="hud-title" fill="#c084fc">APPLIED AI</text>
    <text x="16" y="47" class="hud-val">Gemini • Claude • OpenAI</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">LangChain • Local LLMs</text>
  </g>

  <!-- Col 4: Full-Stack Core -->
  <g transform="translate(635, 20)">
    <rect width="195" height="70" rx="8" fill="#131b2e" stroke="#34d399" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="16" cy="22" r="4" class="blink-dot-4"/>
    <text x="28" y="25" class="hud-title" fill="#34d399">SYSTEMS CORE</text>
    <text x="16" y="47" class="hud-val">TypeScript • React 19</text>
    <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Node • Postgres • Prisma</text>
  </g>
</svg>

<svg width="100%" height="130" viewBox="0 0 850 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techHudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18233c"/>
      <stop offset="100%" stop-color="#0e1728"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="33%" stop-color="#38bdf8"/>
      <stop offset="66%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseCard {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .col-title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    .col-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
    }
    .col-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .dot-1 { animation: blinkDot 2.2s infinite; fill: #f59e0b; }
    .dot-2 { animation: blinkDot 2.2s infinite 0.5s; fill: #38bdf8; }
    .dot-3 { animation: blinkDot 2.2s infinite 1.0s; fill: #a855f7; }
    .dot-4 { animation: blinkDot 2.2s infinite 1.5s; fill: #10b981; }
  </style>

  <!-- Container Base -->
  <rect width="850" height="130" rx="12" fill="url(#techHudBg)" stroke="#1e293b" stroke-width="1.8"/>
  <rect x="0" y="0" width="850" height="3" fill="url(#glowBorder)"/>

  <!-- 4 Pillars of Capability -->
  <!-- Col 1: High-Volume E-Commerce -->
  <g transform="translate(18, 18)">
    <rect width="192" height="92" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="20" r="4" class="dot-1"/>
    <text x="28" y="24" class="col-title" fill="#f59e0b">E-COMMERCE ENGINES</text>
    <text x="16" y="48" class="col-main">Shopify • Magento</text>
    <text x="16" y="66" class="col-sub">WordPress • WooCommerce</text>
    <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">OpenCart • Headless</text>
  </g>

  <!-- Col 2: Enterprise SaaS Systems -->
  <g transform="translate(222, 18)">
    <rect width="192" height="92" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="20" r="4" class="dot-2"/>
    <text x="28" y="24" class="col-title" fill="#38bdf8">ENTERPRISE SAAS</text>
    <text x="16" y="48" class="col-main">React 19 • Next.js</text>
    <text x="16" y="66" class="col-sub">TypeScript • Node.js</text>
    <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">Prisma • PostgreSQL</text>
  </g>

  <!-- Col 3: Multi-Cloud & DevOps -->
  <g transform="translate(426, 18)">
    <rect width="198" height="92" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="20" r="4" class="dot-3"/>
    <text x="28" y="24" class="col-title" fill="#c084fc">MULTI-CLOUD &amp; DEVOPS</text>
    <text x="16" y="48" class="col-main">AWS • GCP • Azure • OCI</text>
    <text x="16" y="66" class="col-sub">Kubernetes • Docker</text>
    <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">Terraform • CI/CD • Sonar</text>
  </g>

  <!-- Col 4: Applied AI & Automation -->
  <g transform="translate(636, 18)">
    <rect width="196" height="92" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="16" cy="20" r="4" class="dot-4"/>
    <text x="28" y="24" class="col-title" fill="#34d399">APPLIED AI SYSTEMS</text>
    <text x="16" y="48" class="col-main">Gemini • Claude • OpenAI</text>
    <text x="16" y="66" class="col-sub">LangChain • Local LLMs</text>
    <text x="16" y="82" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#94a3b8">Vector DBs • Agentic AI</text>
  </g>
</svg>
